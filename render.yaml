services:
  - type: web
    name: daypilot-api
    runtime: python
    plan: free
    rootDir: .
    buildCommand: pip install .
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.1"
      - key: DAYPILOT_DEMO_MODE
        value: "false"
      - key: DAYPILOT_PROVIDER_MODE
        value: managed
      - key: DATABASE_URL
        value: sqlite:///./data/daypilot.db
      - key: DAYPILOT_TIMEZONE
        value: Asia/Kolkata
      - key: TAVILY_BASE_URL
        value: https://api.tavily.com
      - key: OPENAI_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: COMPOSIO_API_KEY
        sync: false
      - key: COMPOSIO_CALLBACK_URL
        value: https://daypilot-api.onrender.com/api/connections/managed/callback
      - key: DAYPILOT_SITE_URL
        value: https://daypilot.dumpydon.workers.dev
      - key: CORS_ORIGINS
        value: '["http://localhost:3000","http://127.0.0.1:3000","https://daypilot.dumpydon.workers.dev"]'
