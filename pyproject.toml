[project]
name = "daypilot"
version = "0.1.0"
description = "MCP-powered personal operations agent with persisted LangGraph HITL"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "aiosqlite>=0.22,<1",
    "composio==0.21.0",
    "cryptography>=42,<47",
  "fastapi>=0.141,<1",
  "httpx>=0.28,<1",
  "langchain>=1.3,<2",
  "langchain-mcp-adapters>=0.3.2,<1",
  "langchain-openai>=1.6,<2",
  "langgraph>=1.2,<2",
  "langgraph-checkpoint-sqlite>=3.1,<4",
  "mcp>=1.29,<2",
  "pydantic-settings>=2.15,<3",
  "python-dotenv>=1.2,<2",
  "uvicorn[standard]>=0.52,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.1,<10",
  "pytest-asyncio>=1.4,<2",
  "ruff>=0.16,<1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", "frontend"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "RUF"]
ignore = ["B008", "RUF001"]

[tool.ruff.lint.per-file-ignores]
"backend/tests/*" = ["S101"]
